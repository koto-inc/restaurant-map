<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>東京グルメショート動画マップ</title>
<meta name="description" content="TikTokのショート動画で見つけた東京のレストランを地図で探せるグルメガイド。" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#ff5a5f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--text)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:10px 14px;background:linear-gradient(180deg,#1a1d24, #14171d);border-bottom:1px solid var(--line);z-index:1000}
  .titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em}
  h1 .pin{color:var(--accent)}
  .count{font-size:12px;color:var(--muted);margin-left:auto}
  .controls{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
  #search{flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:10px;font-size:14px;outline:none}
  #search::placeholder{color:#6b7280}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip[aria-pressed="true"]{border-color:#fff;background:#fff;color:#111;font-weight:700}
  .chip.small{font-size:11px}
  #main{flex:1;position:relative;min-height:0}
  #map{position:absolute;inset:0}
  /* list panel */
  #list{position:absolute;top:0;left:0;bottom:0;width:330px;max-width:82vw;background:rgba(17,20,27,.96);border-right:1px solid var(--line);overflow-y:auto;transform:translateX(0);transition:transform .2s;z-index:800}
  #list.hidden{transform:translateX(-110%)}
  .card{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .card:hover{background:var(--panel2)}
  .card img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#222;flex:none}
  .card .nm{font-size:13.5px;font-weight:700;line-height:1.3}
  .card .meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .rating{display:inline-block;font-size:11.5px;color:#f2c14e;font-weight:700;vertical-align:middle}
  .catpill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;color:#111;font-weight:700}
  #listToggle{position:absolute;top:10px;left:10px;z-index:810;background:#fff;color:#111;border:none;border-radius:8px;padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  /* popup */
  .leaflet-popup-content{margin:10px 12px;min-width:210px}
  .pop img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#222;display:block;margin-bottom:8px}
  .pop .pn{font-size:15px;font-weight:800;color:#111;line-height:1.3}
  .pop .pm{font-size:12px;color:#444;margin-top:5px;line-height:1.5}
  .pop .links{display:flex;gap:8px;margin-top:9px}
  .pop a.btn{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:700;padding:8px;border-radius:8px}
  .pop a.tt{background:#111;color:#fff}
  .pop a.gm{background:#1a73e8;color:#fff}
  .pop a.tb{background:#e8732e;color:#fff}
  .pop .rating{font-size:12px;color:#d98a00}
  .leaflet-popup-content-wrapper{border-radius:12px}
  .marker-pin{width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  footer{font-size:11px;color:var(--muted);text-align:center;padding:6px;background:#0c0e12;border-top:1px solid var(--line)}
  a.flink{color:#7fb0ff}
  @media(max-width:600px){ h1{font-size:16px} #list{width:300px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titlerow">
      <h1><span class="pin">📍</span> 東京グルメショート動画マップ</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="店名・駅・エリアで検索…" autocomplete="off" />
      <div class="chips" id="cats"></div>
    </div>
  </header>
  <div id="main">
    <button id="listToggle">☰ 一覧</button>
    <div id="list"></div>
    <div id="map"></div>
  </div>
  <footer>データ：自分で集めたTikTokショート動画より ／ 地図：© OpenStreetMap contributors</footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CAT_COLORS = {
  "和食":"#e0524f","寿司":"#d6336c","焼き鳥・居酒屋":"#f0883e","焼肉":"#a9744f",
  "ラーメン":"#e3b341","イタリアン":"#3fb950","フレンチ":"#4a9eff","中華":"#f778ba",
  "韓国料理":"#a371f7","カフェ・スイーツ":"#ff8fc7","その他":"#8b949e"
};
const state = { q:"", cats:new Set(), items:[] };
let map, listEl, countEl;

function catColor(c){ return CAT_COLORS[c] || CAT_COLORS["その他"]; }
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }

function hasRating(r){ return r.tabelog!=null && r.tabelog!=="" && !isNaN(r.tabelog); }
function popupHTML(r){
  const rating = hasRating(r) ? `<span class="rating">⭐ ${r.tabelog}</span>` : "";
  const tb = r.tabelogUrl
    ? `<a class="btn tb" href="${r.tabelogUrl}" target="_blank" rel="noopener">食べログ${hasRating(r)?(" "+r.tabelog):""}</a>`
    : "";
  return `<div class="pop">
    <img src="${r.thumb}" loading="lazy" alt="${esc(r.name)}" onerror="this.style.display='none'">
    <div class="pn">${esc(r.name)}</div>
    <div class="pm">
      <span class="catpill" style="background:${catColor(r.category)}">${esc(r.category)}</span> ${rating}<br>
      🚃 ${esc(r.station)}<br>📍 ${esc(r.address)}
    </div>
    <div class="links">
      <a class="btn tt" href="${r.video}" target="_blank" rel="noopener">▶ 動画</a>
      <a class="btn gm" href="${r.gmap}" target="_blank" rel="noopener">地図</a>
      ${tb}
    </div>
  </div>`;
}

function makeMarker(r){
  const icon = L.divIcon({
    className:"", iconSize:[24,24], iconAnchor:[12,24], popupAnchor:[0,-24],
    html:`<div class="marker-pin" style="background:${catColor(r.category)}"></div>`
  });
  const m = L.marker([r.lat,r.lng],{icon});
  m.bindPopup(popupHTML(r),{maxWidth:260});
  return m;
}

function visible(r){
  if(state.cats.size && !state.cats.has(r.category)) return false;
  if(state.q){
    const hay = (r.name+" "+r.station+" "+r.address+" "+r.category).toLowerCase();
    if(!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function render(){
  let n=0; const bounds=[];
  state.items.forEach(it=>{
    const ok = visible(it.r);
    if(ok){ if(!map.hasLayer(it.m)) it.m.addTo(map); bounds.push([it.r.lat,it.r.lng]); n++; }
    else if(map.hasLayer(it.m)) map.removeLayer(it.m);
  });
  countEl.textContent = `${n}件`;
  // list
  listEl.innerHTML = state.items.filter(it=>visible(it.r)).map(it=>{
    const r=it.r;
    const rate = hasRating(r) ? ` <span class="rating">⭐${r.tabelog}</span>` : "";
    return `<div class="card" data-slug="${r.slug}">
      <img src="${r.thumb}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">
      <div><div class="nm">${esc(r.name)}</div>
      <div class="meta"><span class="catpill" style="background:${catColor(r.category)}">${esc(r.category)}</span>${rate} ・ 🚃${esc(r.station)}</div></div>
    </div>`;
  }).join("") || `<div style="padding:18px;color:var(--muted);font-size:13px">該当なし</div>`;
}

function buildCatChips(){
  const cats=[...new Set(state.items.map(i=>i.r.category))];
  const wrap=document.getElementById("cats");
  cats.forEach(c=>{
    const el=document.createElement("div");
    el.className="chip"; el.setAttribute("aria-pressed","false");
    el.innerHTML=`<span class="dot" style="background:${catColor(c)}"></span>${esc(c)}`;
    el.onclick=()=>{ const on=el.getAttribute("aria-pressed")==="true";
      el.setAttribute("aria-pressed", String(!on));
      if(on) state.cats.delete(c); else state.cats.add(c); render(); };
    wrap.appendChild(el);
  });
}

function init(data){
  document.title = data.title || document.title;
  map = L.map("map",{zoomControl:true}).setView([35.681,139.74],12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:"© OpenStreetMap"
  }).addTo(map);
  listEl=document.getElementById("list"); countEl=document.getElementById("count");
  state.items = data.restaurants.map(r=>({r, m:makeMarker(r)}));
  buildCatChips();
  render();
  const all=state.items.map(it=>[it.r.lat,it.r.lng]);
  if(all.length) map.fitBounds(all,{padding:[40,40]});

  document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render();});
  listEl.addEventListener("click",e=>{ const c=e.target.closest(".card"); if(!c)return;
    const it=state.items.find(i=>i.r.slug===c.dataset.slug); if(!it)return;
    map.setView([it.r.lat,it.r.lng],16,{animate:true}); it.m.openPopup();
    if(window.innerWidth<700) document.getElementById("list").classList.add("hidden");
  });
  const lt=document.getElementById("listToggle");
  lt.onclick=()=>document.getElementById("list").classList.toggle("hidden");
  if(window.innerWidth<700) document.getElementById("list").classList.add("hidden");
}
// まず公開用の data.json を取得。失敗（file://でローカル閲覧 等）したら埋め込みデータで表示。
fetch("data.json",{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("data.json not found"); return r.json(); })
  .then(init)
  .catch(()=>init(FALLBACK_DATA));
